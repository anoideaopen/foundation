# https://docs.codecov.com/docs/codecov-yaml
codecov:
  require_ci_to_pass: true

coverage:
  status:
    project:
      default:
        # minimum total coverage the project should have
        target: 0%
    patch:
      default:
        target: 0%

# Exclude files from coverage statistics
ignore:
  - "**/*.pb.go"
